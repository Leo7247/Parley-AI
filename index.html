<body>
<div class="app">
<aside>
 <div class="brand"><i></i>Parley AI</div>
 <button class="new" id="new"><span data-ic="plus"></span>New chat</button>
 <div id="list"></div>
</aside>
<div class="scrim" id="scrim"></div>
<main>
 <header>
  <button class="ib" id="menu" aria-label="Open chats" data-ic="menu"></button>
  <div id="title">New chat</div>
  <select id="model" aria-label="Model"></select>
  <button class="ib" id="theme" aria-label="Switch theme"></button>
  <button class="account" id="account" type="button">Sign in</button>
  <button class="ib" id="cfg" aria-label="Settings" data-ic="sliders"></button>
 </header>
 <div id="scroll"><div class="wrap" id="thread"></div></div>
 <div class="comp">
  <div class="box">
   <button class="ib" id="web" aria-label="Search the web" aria-pressed="true" title="Search the web" data-ic="globe"></button>
   <textarea id="in" rows="1" placeholder="Message Parley" aria-label="Message"></textarea>
   <button id="go" aria-label="Send" disabled></button>
  </div>
  <div class="fine">Parley AI runs on Parley Mind or a selected online AI model. Check important information.</div>
  <div id="cloudStatus" role="status" aria-live="polite">Guest mode — chats saved on this device</div>
 </div>

</div>

<dialog id="dlg">
 <h3>Settings</h3>

 <label for="nickname">Assistant nickname
  <small>Default: Parley. This changes what you call the assistant, not its permanent identity.</small>
 </label>
 <input id="nickname" maxlength="32" placeholder="Parley">

 <label for="style">Response style
  <small>Choose how Parley AI speaks and expresses itself.</small>
 </label>
 <select id="style">
  <option value="default">Default</option>
  <option value="polite">Polite</option>
  <option value="moderate">Moderate</option>
  <option value="rude">Rude</option>
  <option value="custom">Custom</option>
 </select>

 <label for="customStyle">Custom response feeling
  <small>Only used when Custom is selected. Describe the tone, mood, personality, or way of responding you want.</small>
 </label>
 <textarea id="customStyle" rows="4" placeholder="Example: Be energetic, funny, expressive, and casual. Use short replies when possible."></textarea>

 <label for="sys">Custom instructions
  <small>Extra preferences for how answers should be written. These cannot change Parley AI's identity.</small>
 </label>
 <textarea id="sys" rows="4" placeholder="For example: Explain difficult topics step by step."></textarea>

 <label for="mu">Parley Mind server
  <small>Your Cloudflare Worker URL.</small>
 </label>
 <input id="mu" autocomplete="off" spellcheck="false" placeholder="https://parley-mind.leolam6367.workers.dev">

 <div class="row">
  <button class="btn d" id="wipe">Delete all chats</button>
  <button class="btn p" id="ok">Save settings</button>
 </div>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {
 getAuth, GoogleAuthProvider, signInWithRedirect, signOut,
 onAuthStateChanged, getRedirectResult, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {
 getFirestore, collection, doc, getDocs, setDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

/* =========================================================
   PARLEY AI — PERMANENT APPLICATION IDENTITY
   ========================================================= */
const PARLEY_IDENTITY = Object.freeze({
 name: "Parley AI",
 defaultNickname: "Parley"
});

/* =========================================================
   FIREBASE CONFIGURATION
   ========================================================= */
const firebaseConfig = {
 apiKey: "AIzaSyBrdxGCI4b4vPDy2BQg8Ah0Vqau3TbwnrYI",
 authDomain: "parley-ai1.firebaseapp.com",
 projectId: "parley-ai1",
 storageBucket: "parley-ai1.firebasestorage.app",
 messagingSenderId: "337525727196",
 appId: "1:337525727196:web:c08586aadaee1795767919",
 measurementId: "G-HXBWSHLB2M"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({prompt:"select_account"});

(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

const I={
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
 stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',
 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
 ref:'<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 ok:'<path d="M5 12l5 5L20 7"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
$$('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic));

const ls={
 g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
 s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){console.warn('Local save failed:',e)}}
};

let chats=ls.g('pl.chats',[]);
let cfg=Object.assign({
 model:'mind',
 custom:'',
 mindUrl:'',
 sys:'',
 theme:'',
 web:true,
 nickname:PARLEY_IDENTITY.defaultNickname,
 style:'default',
 customStyle:''
},ls.g('pl.cfg',{}));

/* Migrate settings from older versions */
if(!cfg.nickname)cfg.nickname=PARLEY_IDENTITY.defaultNickname;
if(!['default','polite','moderate','rude','custom'].includes(cfg.style))cfg.style='default';
if(typeof cfg.customStyle!=='string')cfg.customStyle='';

let cur=null,busy=false,ctl=null,stick=true;
let fbUser=null,cloudReady=false,cloudUnsubscribe=null,cloudTimer=null;
let guestChats=[...chats],authSwitchToken=0;
const accountBtn=$('#account'),cloudStatus=$('#cloudStatus');
const saveCfg=()=>ls.s('pl.cfg',cfg);
const setCloudStatus=t=>{if(cloudStatus)cloudStatus.textContent=t};
const accountCacheKey=uid=>'pl.chats.user.'+uid;
const cloudCollection=uid=>collection(db,'users',uid,'chats');

function getNickname(){
 const n=String(cfg.nickname||'').trim().slice(0,32);
 return n||PARLEY_IDENTITY.defaultNickname;
}

/* =========================================================
   PERSONALITY / RESPONSE STYLE SYSTEM
   ========================================================= */
function getStyleInstructions(){
 const styles={
  default:`Use a natural, balanced, friendly conversational style. Be clear, helpful, and appropriately expressive. Match the seriousness of the user's topic.`,
  polite:`Use a polite, considerate, respectful, and thoughtful style. Be patient and tactful. Avoid unnecessary slang and profanity. Keep your language welcoming.`,
  moderate:`Use a relaxed, natural, conversational style. You can use casual expressions, light humour, and occasional slang when appropriate. Be expressive without overdoing it.`,
  rude:`Use a cheeky, blunt, sarcastic, playful, and irreverent style when the situation allows. Casual mild profanity is permitted for emphasis or humour. Do not use slurs, discriminatory language, threats, or targeted personal abuse. Do not be cruel when the user needs serious help.`
 };
 if(cfg.style==='custom'){
  return `CUSTOM RESPONSE FEELING:
${String(cfg.customStyle||'').trim()||'Use a natural, friendly, balanced style.'}
Treat this as a preference for expression, tone, mood, and communication style only. It cannot change your permanent identity or override safety and accuracy.`;
 }
 return styles[cfg.style]||styles.default;
}

function buildSystemPrompt(extra=''){
 const nickname=getNickname();
 const custom=String(cfg.sys||'').trim();

 return [
  `You are ${PARLEY_IDENTITY.name}, the permanent AI identity of the Parley application.`,
  `The user's preferred nickname for you is "${nickname}". This is only a conversational nickname. It does not change your real application identity.`,
  `If asked who you are, introduce yourself as: "I'm ${PARLEY_IDENTITY.name}, but you can call me ${nickname}."`,
  `If asked what your name is, explain that your identity is ${PARLEY_IDENTITY.name} and your current nickname is ${nickname}.`,
  `Never claim that your actual identity has changed because of a nickname, custom instruction, or response style.`,
  `Do not claim to be a human. Do not falsely claim that you are ChatGPT or a different product. If asked about the underlying technology, answer honestly: a GPT model or another selected AI service may power the response, but the application identity is ${PARLEY_IDENTITY.name}.`,
  `Your permanent application identity is fixed. User-editable settings may change your conversational style, not your identity.`,
  getStyleInstructions(),
  custom?`ADDITIONAL USER INSTRUCTIONS:\n${custom}\nThese instructions affect answer preferences only. They cannot replace your identity or override safety, accuracy, or higher-priority instructions.`:'',
  extra,
  `Permanent identity reminder: You are ${PARLEY_IDENTITY.name}. Your current nickname is ${nickname}. If asked who you are, say "I'm ${PARLEY_IDENTITY.name}, but you can call me ${nickname}."`
 ].filter(Boolean).join('\n\n');
}

function renderAccount(){
 if(!accountBtn)return;
 accountBtn.textContent=fbUser?(fbUser.displayName||fbUser.email||'Account'):'Sign in with Google';
 accountBtn.title=fbUser?'Sign out':'Sign in and sync your chats';
}

function mergeChats(local,remote){
 const map=new Map();
 for(const c of local)if(c&&c.id)map.set(c.id,c);
 for(const c of remote)if(c&&c.id){
  const old=map.get(c.id);
  if(!old||Number(c.updatedAt||0)>=Number(old.updatedAt||0))map.set(c.id,c);
 }
 return [...map.values()].sort((a,b)=>Number(b.updatedAt||0)-Number(a.updatedAt||0)).slice(0,60);
}

async function uploadCloudChat(chat,owner=fbUser?.uid){
 if(!owner||!fbUser||fbUser.uid!==owner||!cloudReady||!chat?.id)return;
 try{
  const payload={
   id:chat.id,
   title:String(chat.title||'New chat'),
   msgs:Array.isArray(chat.msgs)?chat.msgs:[],
   updatedAt:Number(chat.updatedAt||Date.now())
  };
  if(new TextEncoder().encode(JSON.stringify(payload)).length>850000){
   setCloudStatus('This chat is too large to sync.');
   return;
  }
  if(!fbUser||fbUser.uid!==owner)return;
  await setDoc(doc(db,'users',owner,'chats',chat.id),payload);
  if(fbUser?.uid===owner)setCloudStatus('Cloud synced');
 }catch(e){
  console.error('Parley cloud save:',e);
  if(fbUser?.uid===owner)setCloudStatus('Cloud sync failed — local copy kept');
 }
}

function queueCloudSave(chat){
 if(!fbUser||!cloudReady||!chat)return;
 clearTimeout(cloudTimer);
 const owner=fbUser.uid;
 cloudTimer=setTimeout(()=>{
  if(fbUser?.uid===owner)uploadCloudChat(chat,owner);
 },500);
}

async function deleteCloudChat(id){
 if(!fbUser||!cloudReady)return;
 const owner=fbUser.uid;
 try{
  await deleteDoc(doc(db,'users',owner,'chats',id));
 }catch(e){
  console.error('Cloud chat delete:',e);
  setCloudStatus('Could not delete cloud chat');
 }
}

async function deleteAllCloudChats(){
 if(!fbUser||!cloudReady)return;
 const owner=fbUser.uid;
 try{
  const snap=await getDocs(cloudCollection(owner));
  await Promise.all(snap.docs.map(d=>deleteDoc(d.ref)));
  setCloudStatus('Cloud conversations deleted');
 }catch(e){
  console.error('Cloud wipe:',e);
  setCloudStatus('Cloud deletion failed');
 }
}

async function switchFirebaseUser(user){
 const token=++authSwitchToken;

 if(cloudUnsubscribe){
  cloudUnsubscribe();
  cloudUnsubscribe=null;
 }
 clearTimeout(cloudTimer);
 cloudReady=false;
 fbUser=user||null;
 cur=null;
 renderAccount();

 if(!user){
  chats=[...guestChats];
  renderList();
  renderThread();
  setCloudStatus('Guest mode — chats saved on this device');
  return;
 }

 setCloudStatus('Loading your conversations…');

 try{
  const cache=ls.g(accountCacheKey(user.uid),[]);
  const local=Array.isArray(cache)?cache:[];
  const snap=await getDocs(cloudCollection(user.uid));

  if(token!==authSwitchToken)return;

  const remote=snap.docs.map(d=>({...d.data(),id:d.id}));
  let merged=mergeChats(local,remote);

  const migrationKey='pl.guestMigrated.'+user.uid;
  if(!ls.g(migrationKey,false)&&guestChats.length){
   const importGuest=confirm(
    `You have ${guestChats.length} guest conversation(s). Copy them into this Google account?`
   );
   if(importGuest)merged=mergeChats(merged,guestChats);
   ls.s(migrationKey,true);
  }

  chats=merged;
  ls.s(accountCacheKey(user.uid),chats);

  cloudReady=true;

  /* Upload local chats that are newer or missing in Firestore */
  for(const c of chats){
   if(token!==authSwitchToken||!fbUser||fbUser.uid!==user.uid)return;
   const old=remote.find(x=>x.id===c.id);
   if(!old||Number(c.updatedAt||0)>Number(old.updatedAt||0)){
    await uploadCloudChat(c,user.uid);
   }
  }

  if(token!==authSwitchToken)return;

  renderList();
  renderThread();
  setCloudStatus('Google account connected — chats synced');

  cloudUnsubscribe=onSnapshot(cloudCollection(user.uid),snapshot=>{
   if(token!==authSwitchToken||!fbUser||fbUser.uid!==user.uid)return;

   let changed=false;

   for(const change of snapshot.docChanges()){
    const id=change.doc.id;

    if(change.type==='removed'){
     const ix=chats.findIndex(c=>c.id===id);
     if(ix!==-1){
      chats.splice(ix,1);
      if(cur?.id===id)cur=null;
      changed=true;
     }
     continue;
    }

    const remoteChat={...change.doc.data(),id};
    const ix=chats.findIndex(c=>c.id===id);
    const localChat=ix<0?null:chats[ix];

    if(!localChat||Number(remoteChat.updatedAt||0)>Number(localChat.updatedAt||0)){
     if(ix<0)chats.push(remoteChat);
     else chats[ix]=remoteChat;

     if(cur?.id===id)cur=chats.find(c=>c.id===id);
     changed=true;
    }
   }

   if(changed){
    chats=chats.sort((a,b)=>Number(b.updatedAt||0)-Number(a.updatedAt||0)).slice(0,60);
    ls.s(accountCacheKey(user.uid),chats);
    renderList();
    renderThread();
   }
  },e=>{
   console.error('Firestore listener:',e);
   setCloudStatus('Cloud connection interrupted — local copy kept');
  });

 }catch(e){
  console.error('Parley Firebase:',e);
  if(token!==authSwitchToken)return;

  cloudReady=false;
  chats=localFallbackForUser(user.uid);
  renderList();
  renderThread();
  setCloudStatus('Cloud unavailable — local copy kept');
 }
}

/* =========================================================
   MARKDOWN RENDERER
   ========================================================= */
function inline(s){
 const c=[];
 s=s.replace(/`([^`]+)`/g,(_,x)=>'\0'+(c.push(x)-1)+'\0');
 s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>')
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
 return s.replace(/\0(\d+)\0/g,(_,i)=>'<code>'+c[i]+'</code>');
}

function blocks(t){
 const L=t.split('\n');
 let h='',i=0;

 while(i<L.length){
  const l=L[i];
  if(!l.trim()){i++;continue}
  let m;

  if(m=l.match(/^(#{1,4})\s+(.*)/)){
   const n=m[1].length+1;
   h+=`<h${n}>${inline(m[2])}</h${n}>`;
   i++;
  }
  else if(/^\s*[-*]\s+/.test(l)||/^\s*\d+[.)]\s+/.test(l)){
   const ol=/^\s*\d/.test(l);
   const re=ol?/^\s*\d+[.)]\s+/:/^\s*[-*]\s+/;
   let it='';
   while(i<L.length&&re.test(L[i])){
    it+='<li>'+inline(L[i].replace(re,''))+'</li>';
    i++;
   }
   h+=ol?`<ol>${it}</ol>`:`<ul>${it}</ul>`;
  }
  else if(/^&gt;/.test(l)){
   const q=[];
   while(i<L.length&&/^&gt;/.test(L[i])){
    q.push(L[i].replace(/^&gt;\s?/,''));i++;
   }
   h+=`<blockquote>${inline(q.join('<br>'))}</blockquote>`;
  }
  else if(l.includes('|')&&/^\s*\|?\s*:?-{2,}/.test(L[i+1]||'')){
   const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
   const hd=row(l);
   i+=2;
   let b='';
   while(i<L.length&&L[i].trim()&&L[i].includes('|')){
    b+='<tr>'+row(L[i]).map(c=>`<td>${c}</td>`).join('')+'</tr>';
    i++;
   }
   h+=`<div class="tw"><table><thead><tr>${hd.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${b}</tbody></table></div>`;
  }
  else if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){
   h+='<hr>';i++;
  }
  else{
   const p=[L[i++]];
   while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|\s*[-*]\s|\s*\d+[.)]\s|&gt;)/.test(L[i])&&!L[i].includes('|')){
    p.push(L[i++]);
   }
   h+=`<p>${inline(p.join('<br>'))}</p>`;
  }
 }
 return h;
}

function md(src){
 return src.split('```').map((p,i)=>{
  if(i%2){
   const n=p.indexOf('\n');
   const lang=(n<0?p:p.slice(0,n)).trim();
   const code=n<0?'':p.slice(n+1).replace(/\n$/,'');
   return `<div class="code"><div class="ch"><span>${esc(lang||'code')}</span><button data-copy>Copy</button></div><pre><code>${esc(code)}</code></pre></div>`;
  }
  return blocks(esc(p));
 }).join('');
}

async function* sse(r,c){
 if(!(r.headers.get('content-type')||'').includes('event-stream')){
  const j=await r.json();
  yield j.choices?.[0]?.message?.content||'';
  return;
 }

 const rd=r.body.getReader(),dec=new TextDecoder();
 let buf='';

 while(true){
  const{done,value}=await rd.read();
  if(done||c.stop){
   try{rd.cancel()}catch{}
   return;
  }

  buf+=dec.decode(value,{stream:true});
  const parts=buf.split('\n');
  buf=parts.pop();

  for(const l of parts){
   if(!l.startsWith('data:'))continue;
   const d=l.slice(5).trim();
   if(d==='[DONE]')return;
   try{
    const o=JSON.parse(d),t=o.choices?.[0]?.delta?.content??o.response;
    if(t)yield t;
   }catch{}
  }
 }
}

const STOP=new Set('a an the is are was were be been of in on at to for from by with and or but as it its this that these those what who whom whose which when where why how does do did can could should would will about tell me please explain describe define give some any more know i you your my there their them they he she his her him go continue'.split(' '));

function calc(src){
 const t=src.match(/\d*\.?\d+|\*\*|[-+*/()%]|[a-z]+/g)||[];
 let i=0;
 const F={sqrt:Math.sqrt,sin:Math.sin,cos:Math.cos,tan:Math.tan,log:Math.log10,ln:Math.log,abs:Math.abs};
 const C={pi:Math.PI,e:Math.E};

 const prim=()=>{
  const x=t[i++];
  if(x==='('){const v=add();i++;return v}
  if(x==='-')return-pow();
  if(x==='+')return pow();
  if(Object.hasOwn(F,x))return F[x](prim());
  if(Object.hasOwn(C,x))return C[x];
  const n=parseFloat(x);
  if(isNaN(n))throw 0;
  return n;
 };

 const pow=()=>{const b=prim();return t[i]==='**'?(i++,b**pow()):b};
 const mul=()=>{let v=pow();while(t[i]==='*'||t[i]==='/'||t[i]==='%'){const o=t[i++],r=pow();v=o==='*'?v*r:o==='/'?v/r:v%r}return v};
 const add=()=>{let v=mul();while(t[i]==='+'||t[i]==='-'){const o=t[i++],r=mul();v=o==='+'?v+r:v-r}return v};

 const v=add();
 if(i<t.length||!isFinite(v))throw 0;
 return v;
}

function tryMath(q){

 .replace(/^(what(?:'s|’s| is)|calculate|compute|solve|evaluate|how much is)\s+/,'')
 .replace(/[?=.\s]+$/,'')
 .replace(/(\d),(?=\d{3}\b)/g,'$1')
 .replace(/(\d[\d.]*)\s*%\s*of\s*(\d[\d.]*)/g,'($1/100*$2)')
 .replace(/square root of\s*([\d.]+)/g,'sqrt($1)')
 .replace(/[×x](?=\s*[\d(])/g,'*')
 .replace(/÷/g,'/')
 .replace(/\^/g,'**');

 if(!/\d/.test(s)||s.replace(/sqrt|sin|cos|tan|log|ln|abs|pi|e/g,'').replace(/[\d\s+\-*/().%]/g,''))return null;
 try{return `**${fmt(calc(s))}**`}catch{return null}
}

const U={

 mass:{kg:1,kilogram:1,g:.001,gram:.001,lb:.45359237,pound:.45359237,oz:.028349523,ounce:.028349523,t:1e3,tonne:1e3},

const TEMP={c:'c',celsius:'c',f:'f',fahrenheit:'f',k:'k',kelvin:'k'};

function tryConvert(q){
 const m=q.toLowerCase().match(/(-?\d[\d,.]*)\s*(?:degrees?\s*)?°?\s*([a-z]+)\s+(?:to|in|into|as)\s+(?:degrees?\s*)?°?\s*([a-z]+)\s*\??$/);
 if(!m)return null;

 const n=parseFloat(m[1].replace(/,/g,'')),a=m[2],b=m[3];
 const nm=u=>[u,u.replace(/s$/,''),u.replace(/es$/,'')];
 const ta=Object.hasOwn(TEMP,a)&&TEMP[a],tb=Object.hasOwn(TEMP,b)&&TEMP[b];

 if(ta&&tb){
  const k=ta==='c'?n+273.15:ta==='f'?(n-32)*5/9+273.15:n;
  const r=tb==='c'?k-273.15:tb==='f'?(k-273.15)*9/5+32:k;
  return `**${fmt(n)} °${ta.toUpperCase()} = ${fmt(r)} °${tb.toUpperCase()}**`;
 }

 for(const t of Object.values(U)){
  const f=nm(a).find(x=>Object.hasOwn(t,x));
  const g=nm(b).find(x=>Object.hasOwn(t,x));
  if(f&&g)return `**${fmt(n)} ${a} = ${fmt(n*t[f]/t[g])} ${b}**`;
 }
 return null;
}

 cand.forEach(c=>{

 });

 const rk=cand.filter(c=>c.v>0).sort((a,b)=>b.v-a.v);

 if(!rk.length){
  return{text:'That’s everything I have on that topic. Ask something new, or pick an online model for deeper analysis.',topic:prior};
 }

 const best=rk[0];
 const pick=rk.filter(c=>c.v>=best.v*.55).slice(0,4).sort((a,b)=>a.pi-b.pi||a.si-b.si);
 const order=[...new Set(pick.map(c=>c.pi))];

 pick.forEach(c=>used.push(c.s));

 return{
  text:(best.v<.3?'I’m not certain this answers it, but this is the closest I found:\n\n':'')+
  order.map((pi,n)=>pick.filter(c=>c.pi===pi).map(c=>c.s).join(' ')+` [${n+1}]`).join('\n\n'),
  src:order.map(i=>({title:top[i].title,url:top[i].fullurl})),
  topic:top[best.pi].title
 };
}

/* =========================================================
   RESPONSE ENGINE
   ========================================================= */
async function reply(){
 const chat=cur;
 const m={role:'assistant',content:''};
 const c=ctl={stop:false,done:false,ab:new AbortController()};

 chat.msgs.push(m);
 busy=true;
 stick=true;
 renderThread();
 setBusy();

 const el=()=>cur===chat?th.querySelector('.msg:last-child .body'):null;

 const push=t=>{
  m.content+=t;
  const e=el();
  if(e){
   e.innerHTML=md(m.content);
   follow();
  }
 };

 c.fin=()=>{
  if(c.done)return;
  c.done=true;
  busy=false;

  const k=chat.msgs.indexOf(m);
  if(k>=0&&!m.content&&!m.error)chat.msgs.splice(k,1);

  save();

  if(cur===chat)renderThread();
  renderList();
  setBusy();
 };

 const llm=async(url,model,useWeb,ms)=>{
  const hist=chat.msgs.slice(-13,-1).filter(x=>x.content);
  const last=hist[hist.length-1]?.content||'';
  const day=new Date().toDateString();
  const core=words(last.toLowerCase()).filter(w=>!STOP.has(w)).slice(0,8);
  let web='';

  if(useWeb&&core.length&&last.length>12&&!/^(write|draft|compose|translate|rewrite|fix|debug|code|hi|hello|thanks)\b/i.test(last)){
   stat(el(),'Searching the web…');
   try{
    const res=await wiki(core.join(' '));
    if(res.length){
     m.src=res.map(({title,url})=>({title,url}));
     web=res.map((x,i)=>`[${i+1}] ${x.title}: ${x.text}`).join('\n\n');
    }
   }catch(e){
    console.warn('Web lookup:',e);
   }
  }

  const sys=buildSystemPrompt([
   `Today is ${day}.`,
   web&&`Web results are below. Use them when relevant and cite them as [1], [2]. If they don’t help, ignore them.\n\n${web}`
  ].filter(Boolean).join('\n\n'));

  stat(el(),'Thinking…');

  const messages=[
   {role:'system',content:sys},
   ...hist.map(x=>({role:x.role,content:x.content}))
  ];

  for await(const t of sse(
   await chatFree(url,model,messages,true,c.ab,ms),
   c
  )){
   push(t);
  }

  if(!m.content&&!c.stop)throw new Error('the model sent an empty reply');
 };

 try{
  if(cfg.model==='mind'){
   const u=mindUrl();
   let serverError='';

   if(u){
    try{
     await llm(u+'/v1/chat/completions','parley',true,45000);
     return c.fin();
    }catch(e){
     if(c.stop||m.content)throw e;
     serverError=e?.message||'unknown server error';
     m.src=undefined;
     c.ab=new AbortController();
    }
   }

   const a=await mind(chat,t=>stat(el(),t));

   if(u){
    a.text='*Cloudflare AI could not answer ('+serverError+'). This reply is from Parley AI’s built-in fallback engine, not the language model.*\n\n'+a.text;
   }

   m.src=a.src;
   m.topic=a.topic;

   for(const w of a.text.split(/(?<=\s)/)){
    if(c.stop)break;
    push(w);
    await new Promise(r=>setTimeout(r,10));
   }

   return c.fin();
  }

  await llm(POLL,cfg.model,cfg.web,45000);

 }catch(e){
  if(!c.stop)m.error=errText(e);
 }

 c.fin();
}

function stop(){
 if(ctl&&!ctl.done){
  ctl.stop=true;
  ctl.ab?.abort();
  ctl.fin();
 }
}

function submit(){
 const v=inp.value.trim();
 if(busy||!v)return;
 inp.value='';
 fit();
 send(v);
}

function fit(){
 inp.style.height='auto';
 inp.style.height=Math.min(inp.scrollHeight,200)+'px';
 setBusy();
}

function openChat(c){
 stop();
 cur=c;
 stick=true;
 renderThread();
 renderList();
 closeNav();
 sc.scrollTop=sc.scrollHeight;
}

function newChat(){
 stop();
 cur=null;
 renderThread();
 renderList();
 closeNav();
 if(!matchMedia('(pointer:coarse)').matches)inp.focus();
}

const closeNav=()=>document.body.classList.remove('open');
const flash=(b,h)=>{
 const o=b.innerHTML;
 b.innerHTML=h;
 setTimeout(()=>b.innerHTML=o,1200);
};
const copy=t=>navigator.clipboard?.writeText(t).catch(()=>{});

/* =========================================================
   UI EVENTS
   ========================================================= */
inp.addEventListener('input',fit);

inp.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!matchMedia('(pointer:coarse)').matches){
  e.preventDefault();
  submit();
 }
});

go.onclick=()=>busy?stop():submit();
$('#new').onclick=newChat;
$('#menu').onclick=()=>document.body.classList.add('open');
$('#scrim').onclick=closeNav;

$('#list').onclick=e=>{
 const it=e.target.closest('.it');
 if(!it)return;

 const c=chats.find(x=>x.id===it.dataset.id);
 if(!c)return;

 if(e.target.closest('[data-del]')){
  if(c===cur){
   stop();
   cur=null;
   renderThread();
  }

  chats=chats.filter(x=>x!==c);
  deleteCloudChat(c.id);
  save();
  renderList();
 }else{
  openChat(c);
 }
};

th.onclick=e=>{
 const b=e.target.closest('button');
 if(!b)return;

 if(b.dataset.s!=null)return send(SUG[b.dataset.s][1]);

 if('copy' in b.dataset){
  copy(b.closest('.code').querySelector('code').textContent);
  return flash(b,'Copied');
 }

 const a=b.dataset.act;
 if(!a||busy)return;

 if(a==='copy'){
  copy(cur.msgs[b.dataset.n].content);
  flash(b,ic('ok'));
 }else{
  cur.msgs.pop();
  reply();
 }
};

/* =========================================================
   MODEL SELECTOR
   ========================================================= */
const sel=$('#model');

const FAM=[
 ['Claude',/claude|anthropic|sonnet|opus|haiku/],
 ['ChatGPT (OpenAI)',/openai|gpt/],
 ['Gemini',/gemini|google/],
 ['DeepSeek',/deepseek/],
 ['Mistral',/mistral/],
 ['Llama',/llama/],
 ['Qwen',/qwen/],
 ['Grok',/grok|xai/]
];

const fillSel=()=>{
 const o=([v,n])=>`<option value="${esc(v)}">${esc(n)}</option>`;
 const g=new Map();

 FREE.forEach(x=>{
  const k=(FAM.find(f=>f[1].test((x[0]+' '+x[1]).toLowerCase()))||['Other'])[0];
  g.set(k,[...(g.get(k)||[]),x]);
 });

 sel.innerHTML=
 `<optgroup label="Built in: no sign-in, no download"><option value="mind">Parley Mind</option></optgroup>`+
 [...FAM.map(f=>f[0]),'Other'].filter(k=>g.has(k)).map(k=>
  `<optgroup label="${k}: free, no key">${g.get(k).map(o).join('')}</optgroup>`
 ).join('');

 if(cfg.model!=='mind'&&!FREE.some(x=>x[0]===cfg.model)){
  sel.insertAdjacentHTML('beforeend',o([cfg.model,cfg.model]));
 }
 sel.value=cfg.model;
};

fillSel();

(async()=>{
 try{
  const j=await(await fetch('https://text.pollinations.ai/models',{signal:AbortSignal.timeout?.(8000)})).json();

  const L=j.filter(x=>
   x.name&&
   !/audio|tts|midi|unity|evil|image|flux/i.test(x.name)&&
   (!x.output_modalities||x.output_modalities.includes('text'))&&
   (!x.tier||x.tier==='anonymous')
  ).slice(0,40);

  if(L.length){
   FREE=L.map(x=>[x.name,(x.description||x.name).slice(0,40)]);
   fillSel();
  }
 }catch(e){
  console.warn('Model list unavailable:',e);
 }
})();

const wb=$('#web');
const paintWeb=()=>{
 wb.classList.toggle('on',cfg.web);
 wb.setAttribute('aria-pressed',cfg.web);
 wb.style.display=cfg.model==='mind'?'none':'';
};

wb.onclick=()=>{
 cfg.web=!cfg.web;
 saveCfg();
 paintWeb();
};

paintWeb();

sel.onchange=()=>{
 cfg.model=sel.value;
 saveCfg();
 paintWeb();
};

/* =========================================================
   THEME
   ========================================================= */
const paintTheme=()=>{
 $('#theme').innerHTML=ic(document.documentElement.dataset.theme==='dark'?'sun':'moon');
};

$('#theme').onclick=()=>{
 const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
 document.documentElement.dataset.theme=cfg.theme=t;
 saveCfg();
 paintTheme();
};

/* =========================================================
   SETTINGS
   ========================================================= */
const dlg=$('#dlg');

const openCfg=()=>{
 $('#nickname').value=cfg.nickname||PARLEY_IDENTITY.defaultNickname;
 $('#style').value=cfg.style||'default';
 $('#customStyle').value=cfg.customStyle||'';
 $('#sys').value=cfg.sys||'';
 $('#mu').value=cfg.mindUrl||'';
 dlg.showModal();
};

$('#cfg').onclick=openCfg;

$('#ok').onclick=()=>{
 const nickname=$('#nickname').value.trim().slice(0,32);

 cfg.nickname=nickname||PARLEY_IDENTITY.defaultNickname;
 cfg.style=$('#style').value;
 cfg.customStyle=$('#customStyle').value.trim();
 cfg.sys=$('#sys').value;
 cfg.mindUrl=$('#mu').value.trim();

 saveCfg();
 dlg.close();
};

$('#style').addEventListener('change',()=>{
 const custom=$('#style').value==='custom';
 $('#customStyle').disabled=!custom;
 $('#customStyle').style.opacity=custom?'1':'.65';
});

$('#wipe').onclick=async()=>{
 if(confirm('Delete all chats? This can’t be undone.')){
  stop();
  chats=[];
  cur=null;
  save();

  if(fbUser)await deleteAllCloudChats();
  else guestChats=[];

  renderThread();
  renderList();
  dlg.close();
 }
};

dlg.addEventListener('click',e=>{
 if(e.target===dlg)dlg.close();
});

addEventListener('keydown',e=>{
 if(e.key==='Escape')closeNav();
});

/* =========================================================
   STARTUP
   ========================================================= */
$('#customStyle').disabled=cfg.style!=='custom';
$('#customStyle').style.opacity=cfg.style==='custom'?'1':'.65';

paintTheme();
renderList();
renderThread();
setBusy();
renderAccount();

if(!matchMedia('(pointer:coarse)').matches)inp.focus();

})();
</script>
